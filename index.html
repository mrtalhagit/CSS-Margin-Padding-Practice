<!DOCTYPE html>
<html>
<head>
    <title>My Practice Page</title>

    <style>

        /* Element selector */
        body {
            background-color: #f2f2f2;
            color: #333333;
            margin: 0;
        }

        /* ID selector */
        #header {
            background-color: #1e3a5f;
            color: white;
            height: 100px;
            padding: 20px;
            border: 3px solid #102a43;
        }

        /* Element selector */
        h1 {
            margin: 10px;
        }

        /* Class selector */
        .intro {
            background-color: white;
            color: #444444;
            margin: 20px 80px;
            padding: 20px;
            border: 2px solid #cccccc;
        }

        /* Class selector */
        .box {
            background-color: #d9ecff;
            color: #174a7c;
            margin: 20px;
            padding: 5px;
            border: 2px solid #174a7c;
            height: 80px;
        }

        .box2 {
            background-color: #d9ecff;
            color: #174a7c;
            margin: 20px 130px;
            padding: 60px;
            border: 2px solid #174a7c;
            height: 80px;
        }

        /* Element selector */
        footer {
            background-color: #222222;
            color: white;
            height: 60px;
            padding: 20px;
            margin-top: 30px;
            border: 2px solid black;
        }

    </style>
</head>

<body>

    <header id="header">
        <h1>My Web Page</h1>
        <p>HTML and CSS Practice</p>
    </header>

    <div class="intro">
        <h2>About Me</h2>
        <p>
            Hello! I am learning web development.
            This is my simple HTML and CSS practice page.
        </p>
    </div>

    <div class="box">
        <h2>My Skills</h2>
        <pre>HTML  |  CSS  |  Web Design</pre>
    </div>

    <div class="box2">
        <h2>My Goal</h2>
        <p>I want to become a good web developer.</p>
    </div>

    <footer>
        <p>© 2026 My Web Page</p>
    </footer>

</body>
</html>
